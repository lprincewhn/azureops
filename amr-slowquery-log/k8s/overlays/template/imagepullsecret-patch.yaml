# Only needed when the AKS kubelet identity has no AcrPull role on the registry
# (i.e. `az aks update --attach-acr` was not run / not permitted). Create the
# secret first using the password-stdin flow in docs/deployment.md, then keep
# this patch in kustomization.yaml.
#
# If the kubelet identity does have AcrPull, drop this file from the
# `patches:` list in kustomization.yaml instead.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: amr-slowquery-exporter
spec:
  template:
    spec:
      imagePullSecrets:
        - name: acr-pull
