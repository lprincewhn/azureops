# One JSON array entry per cluster.
# Pod-0 reads index 0, Pod-1 reads index 1, and so on.
# To add a cluster: append an entry here and increase replicas-patch.yaml by 1.
# To remove a cluster: delete the LAST entry and decrease replicas-patch.yaml by 1.
#
# Values are injected from .env by envsubst — never hard-code an access key here,
# this file is under version control. For additional clusters, define suffixed
# variables in .env (AMR_HOST_B, AMR_ACCESS_KEY_B, …) and reference them below.
apiVersion: v1
kind: Secret
metadata:
  name: amr-clusters-config
type: Opaque
stringData:
  clusters.json: |
    [
      {
        "AMR_CLUSTER_NAME": "${AMR_CLUSTER_NAME}",
        "AMR_HOST": "${AMR_HOST}",
        "AMR_PORT": ${AMR_PORT},
        "AMR_ACCESS_KEY": "${AMR_ACCESS_KEY}",
        "AMR_CLUSTER_POLICY": "${AMR_CLUSTER_POLICY}",
        "AMR_SSL_VERIFY": "${AMR_SSL_VERIFY}"
      }
    ]
